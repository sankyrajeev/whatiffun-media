name: align words
# Word timestamps for a narration (the cloud workspace can't download speech models).
# Push story/align/<name>.txt containing one repo-relative audio path; this writes <audio>.words.json next to it.
on:
  push:
    branches: [main]
    paths: ["story/align/*.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: align-words
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "setuptools<80" wheel
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-build-isolation openai-whisper==20240930
      - name: Align
        run: |
          set -euo pipefail
          shopt -s nullglob
          for list in story/align/*.txt; do
            while read -r audio; do
              [ -z "${audio:-}" ] && continue
              case "$audio" in story/*) ;; *) continue;; esac
              case "$audio" in *..*) continue;; esac
              [ -f "$audio" ] || { echo "missing $audio"; continue; }
              python - "$audio" <<'PY'
          import json, sys, whisper
          a = sys.argv[1]
          m = whisper.load_model("small.en")
          r = m.transcribe(a, word_timestamps=True, language="en", condition_on_previous_text=False)
          words = [{"word": w["word"].strip(), "start": round(w["start"], 3), "end": round(w["end"], 3)}
                   for s in r["segments"] for w in s["words"]]
          json.dump({"text": r["text"], "words": words}, open(a.rsplit(".", 1)[0] + ".words.json", "w"), indent=1)
          print(len(words), "words")
          PY
            done < "$list"
            git rm -q "$list"
          done
      - name: Commit
        run: |
          git config user.name "whatiffun-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A story
          git commit -qm "align words" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
